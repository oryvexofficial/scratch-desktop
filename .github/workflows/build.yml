name: Build Scratch Desktop (Unsigned)

on:
  push:
    branches: [ develop, main, master ]
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Build on both Windows and macOS for broader compatibility.
        # You can remove one if you only need a single platform.
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      # Mirror the official CI's cache locations for Electron & electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The project uses .nvmrc to pin the Node version
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache Electron prebuilt binary
        uses: actions/cache@v4
        with:
          path: .cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache electron-builder tools
        uses: actions/cache@v4
        with:
          path: .cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: npm ci

      - name: Fetch media library assets
        # The README requires running this after checkout or when scratch-gui changes.
        run: npm run fetch

      - name: Build unsigned desktop app
        # 'distDev' produces an unsigned build and needs no signing configuration.
        # For a signed release build, you would use 'npm run dist' and configure
        # the necessary secrets (e.g., for Windows Azure Signing or Apple notarization).
        run: npm run distDev

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scratch-desktop-${{ matrix.os }}
          # The output directory is typically 'dist' for electron-builder.
          # Check the 'dist' folder in your repository after a local build to confirm.
          path: dist/
          if-no-files-found: warn
